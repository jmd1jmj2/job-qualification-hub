<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career Strategy Hub</title>
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="hubFrame" src="/hub-v10.html?v=15" title="Career Strategy Hub"></iframe>
<script>
const frame=document.getElementById('hubFrame');
let scoutJobs=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]));
function todayLocal(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getInnerOpps(){try{return frame.contentWindow.eval('opps')}catch{return[]}}
function saveInner(){try{frame.contentWindow.eval('saveAll();render()')}catch{}}
function scoutReadiness(j){const desc=(j.jobDescription||'').trim();return desc.length>=1200?{label:'Ready — Description Captured',cls:'scout-desc',ready:true}:{label:'Needs Revalidation',cls:'scout-needs',ready:false}}
function findScout(title,company,url){return scoutJobs.find(j=>(j.title===title&&j.company===company)||(url&&j.url===url))}
function findBestDescription(title,company,url,current=''){
 let desc=(current||'').trim();if(desc.length>=1200)return desc;
 const opp=getInnerOpps().find(o=>(o.title===title&&o.company===company)||(url&&o.url===url));if(opp&&(opp.description||'').trim().length>=1200)return opp.description.trim();
 const sj=findScout(title,company,url);if(sj&&(sj.jobDescription||'').trim().length>=1200)return sj.jobDescription.trim();
 return desc;
}
function applyAssessment(d,data){const a=data.assessment||data;if(!a||!a.scores)throw new Error('Assessment returned without usable scoring data.');
 if(a.roleTitle)d.getElementById('title').value=a.roleTitle;if(a.company)d.getElementById('company').value=a.company;if(a.location||a.workStyle)d.getElementById('location').value=[a.location,a.workStyle].filter(Boolean).join(' — ');if(a.travelPercent!=null)d.getElementById('travel').value=a.travelPercent;if(a.publishedBaseMin!=null)d.getElementById('baseMin').value=a.publishedBaseMin;if(a.publishedBaseMax!=null)d.getElementById('baseMax').value=a.publishedBaseMax;if(a.targetBonusPercent!=null)d.getElementById('bonus').value=a.targetBonusPercent;if(a.equityOrRsuEstimate!=null)d.getElementById('equity').value=a.equityOrRsuEstimate;
 d.getElementById('sQual').value=a.scores.qualification??80;d.getElementById('sStrategy').value=a.scores.strategicCareer??85;d.getElementById('sLeadership').value=a.scores.leadershipScope??85;d.getElementById('sComp').value=a.scores.compensation??80;d.getElementById('sDiff').value=a.scores.differentiation??85;d.getElementById('sLife').value=a.scores.lifestyle??80;d.getElementById('risk').value=[a.gapSeverity,a.riskSummary].filter(Boolean).join(' — ');d.getElementById('why').value=a.whyWorthIt||'';try{frame.contentWindow.eval('updateLive()')}catch{}if(a.recommendation)d.getElementById('recommendation').value=a.recommendation;
}
async function robustAssess(){const d=frame.contentDocument;if(!d)return;const status=d.getElementById('assessmentStatus'),btn=d.getElementById('assessJob');const title=(d.getElementById('title').value||'').trim(),company=(d.getElementById('company').value||'').trim(),url=(d.getElementById('url').value||'').trim();let desc=findBestDescription(title,company,url,(d.getElementById('description').value||''));if(desc.length>=1200){d.getElementById('description').value=desc;d.getElementById('modeText')?.click()}
 if(!url&&desc.length<1200){status.className='error';status.textContent='This role does not yet have enough job-posting content to assess. Add the full job description first.';return}
 status.className='notice';status.textContent=desc.length>=1200?'Assessing from captured job description…':'Assessing from job link…';btn.disabled=true;btn.textContent='Assessing…';
 try{const payload=desc.length>=1200?{jobDescription:desc}:{jobUrl:url};const r=await fetch('/api/assess',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{throw new Error('Assessment service returned an unreadable response.')}if(!r.ok)throw new Error(data.error||'Assessment failed');applyAssessment(d,data);status.className='success';status.textContent='Assessment complete'+(data.assessorVersion?' · '+data.assessorVersion:'')+'. Review the scores and save the role.';}catch(e){status.className='error';status.textContent='Assessment could not complete: '+e.message}finally{btn.disabled=false;btn.textContent='Assess Job'}}
function installAssessmentFix(){const d=frame.contentDocument,w=frame.contentWindow;if(!d||!w)return;const btn=d.getElementById('assessJob');if(btn)btn.onclick=robustAssess;w.assessOpp=function(id){const opps=getInnerOpps(),o=opps.find(x=>x.id===id);if(!o)return;d.getElementById('title').value=o.title||'';d.getElementById('company').value=o.company||'';d.getElementById('url').value=o.url||'';let desc=findBestDescription(o.title,o.company,o.url,o.description||'');if(desc.length>=1200){o.description=desc;d.getElementById('description').value=desc;saveInner();d.getElementById('modeText')?.click()}else{d.getElementById('description').value=o.description||'';d.getElementById('modeLink')?.click()}w.location.hash='assess';d.getElementById('assessmentStatus').className='notice';d.getElementById('assessmentStatus').textContent=desc.length>=1200?'Full job description loaded. Tap Assess Job.':'Role loaded. Tap Assess Job.';setTimeout(()=>d.getElementById('assessJob')?.scrollIntoView({behavior:'smooth',block:'center'}),150)};}
function scoutMarkup(){return `<div id="dailyScout" class="daily-scout"><div class="scout-head"><div><h3>Daily Job Scout</h3><p>Fresh roles surfaced for your strategic career direction. Scout roles are only assessable when a substantial job description has been captured.</p></div><div class="small" id="scanTime">Loading latest scan…</div></div><div class="scout-notice"><strong>Scout priorities:</strong> enterprise strategy, transformation, workforce/HR technology strategy, employee experience, workforce intelligence, future of work/AI, product strategy, executive advisory, thought leadership, customer transformation, and strategic professional services. Tactical reporting/system-admin roles are deprioritized.</div><div id="dailyJobs" class="scout-jobs"><div class="empty">Loading jobs…</div></div></div>`}
function installScout(){const d=frame.contentDocument,w=frame.contentWindow;if(!d||!w)return;if(d.getElementById('dailyScout'))return;const style=d.createElement('style');style.textContent=`.daily-scout{margin:16px 0 18px;padding:16px;border:1px solid #c7d7fe;border-radius:14px;background:#f8f9ff}.scout-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.scout-head h3{margin:0 0 5px;font-size:20px}.scout-head p{margin:0}.scout-notice{background:#eef4ff;border:1px solid #c7d7fe;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}.scout-jobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.scout-job{border:1px solid #e4e7ec;border-radius:12px;padding:14px;background:#fff}.scout-job h4{margin:7px 0 4px;font-size:17px}.scout-meta{font-size:12px;color:#667085;margin-bottom:10px}.scout-score{font-size:28px;font-weight:900}.scout-badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.scout-new{background:#d1fadf;color:#05603a}.scout-lane{background:#eef2ff;color:#3538cd}.scout-desc{background:#d1fadf;color:#05603a}.scout-needs{background:#fef0c7;color:#7a2e0e}.scout-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.scout-actions button:disabled{opacity:.55;cursor:not-allowed}@media(max-width:700px){.daily-scout{padding:12px}.scout-head{display:block}.scout-jobs{grid-template-columns:1fr}.scout-actions{display:grid;grid-template-columns:1fr}.scout-actions .btn{width:100%;text-align:center}}`;d.head.appendChild(style);const opp=d.getElementById('opportunities');if(!opp)return;const card=opp.querySelector('.card');if(!card)return;const sectionhead=card.querySelector('.sectionhead');const holder=d.createElement('div');holder.innerHTML=scoutMarkup();const scout=holder.firstElementChild;if(sectionhead)sectionhead.insertAdjacentElement('afterend',scout);else card.prepend(scout);w.addScoutToHub=id=>addToHub(id);loadFeed()}
function syncExisting(){const opps=getInnerOpps();let changed=false;for(const j of scoutJobs){const desc=(j.jobDescription||'').trim();if(desc.length<1200)continue;const o=opps.find(x=>(x.title===j.title&&x.company===j.company)||(x.url&&j.url&&x.url===j.url));if(o&&(!o.description||o.description.trim().length<1200)){o.description=desc;o.url=j.url||o.url;o.note=(o.note?o.note+' · ':'')+'Full scout job description synced';changed=true}}if(changed)saveInner()}
function renderJobs(data){const d=frame.contentDocument;if(!d)return;scoutJobs=data.jobs||[];const scan=d.getElementById('scanTime'),holder=d.getElementById('dailyJobs');if(!holder)return;if(scan)scan.textContent=data.generatedAt?'Last scan: '+new Date(data.generatedAt).toLocaleString():'Latest scan';if(!scoutJobs.length){holder.innerHTML='<div class="empty">No strong new matches in the latest scan.</div>';return}holder.innerHTML=scoutJobs.sort((a,b)=>(b.scoutScore||0)-(a.scoutScore||0)).map(j=>{const r=scoutReadiness(j);return '<div class="scout-job"><div><span class="scout-badge scout-lane">'+esc(j.fitLane||'Strategic fit')+'</span> '+(j.foundDate===todayLocal()?'<span class="scout-badge scout-new">New Today</span> ':'')+'<span class="scout-badge '+r.cls+'">'+r.label+'</span></div><h4>'+esc(j.title)+'</h4><div class="scout-meta">'+esc(j.company)+' · '+esc(j.location||'')+(j.salary?' · '+esc(j.salary):'')+'</div><div class="scout-score">'+esc(j.scoutScore||'—')+'%</div><div class="small">Scout fit</div><p>'+esc(j.summary||'')+'</p><div class="scout-actions">'+(j.url?'<a class="btn secondary" target="_blank" rel="noopener" href="'+esc(j.url)+'">Open Job</a>':'')+'<button class="btn primary" onclick="addScoutToHub(\''+esc(j.id)+'\')" '+(r.ready?'':'disabled')+'>'+(r.ready?'Add to Opportunities':'Needs Revalidation')+'</button></div></div>'}).join('');syncExisting();installAssessmentFix()}
async function loadFeed(){try{const r=await fetch('/data/daily-jobs.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();renderJobs(await r.json())}catch{const d=frame.contentDocument;if(d){const h=d.getElementById('dailyJobs'),s=d.getElementById('scanTime');if(h)h.innerHTML='<div class="empty">Daily Scout feed is temporarily unavailable.</div>';if(s)s.textContent='Could not load latest scan'}}}
function addToHub(id){const j=scoutJobs.find(x=>x.id===id);if(!j)return;const r=scoutReadiness(j);if(!r.ready){alert('This scout role does not yet have enough captured job-description content to assess reliably.');return}const d=frame.contentDocument,w=frame.contentWindow;if(!d||!w)return;const opps=getInnerOpps();const existing=opps.find(o=>(o.url&&j.url&&o.url===j.url)||(o.title===j.title&&o.company===j.company));if(existing){existing.description=j.jobDescription||'';existing.url=j.url||existing.url;saveInner();alert('This role is already in Job Opportunities. Its full description has been refreshed.');w.location.hash='opportunities';return}const title=d.getElementById('oppTitle'),company=d.getElementById('oppCompany'),url=d.getElementById('oppUrl'),status=d.getElementById('oppStatus'),desc=d.getElementById('oppDescription'),save=d.getElementById('saveOpp');if(!title||!company||!url||!save)return;title.value=j.title||'';company.value=j.company||'';url.value=j.url||'';if(status)status.value='To Review';if(desc)desc.value=j.jobDescription||'';save.click();w.location.hash='opportunities'}
frame.addEventListener('load',()=>setTimeout(()=>{installScout();installAssessmentFix()},350));
</script>
</body></html>
