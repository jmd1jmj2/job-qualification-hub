<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Strategy Hub</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="hub" src="hub-v7.html?v=8" title="Career Strategy Hub"></iframe><script>
const frame=document.getElementById('hub');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!w||!d||!w.opps)return;
  const style=d.createElement('style');
  style.textContent='.opp-pipeline{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}.opp-group{border:1px solid #e4e7ec;border-radius:14px;background:#fff;overflow:hidden}.opp-group h3{margin:0;padding:12px 14px;background:#f8f9fc;border-bottom:1px solid #e4e7ec;font-size:16px}.opp-count{font-size:12px;color:#667085;font-weight:400}.opp-card{padding:14px;border-bottom:1px solid #eef0f3}.opp-card:last-child{border-bottom:0}.opp-card-title{font-weight:800;margin-bottom:3px}.opp-meta{font-size:12px;color:#667085;margin-bottom:8px}.opp-card select{max-width:190px}.opp-archived{opacity:.6}@media(max-width:800px){.opp-pipeline{grid-template-columns:1fr}}';
  d.head.appendChild(style);
  const statuses=['To Review','High Interest','Maybe','Recheck','No Longer Relevant'];
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const safeUrl=url=>{try{const u=new URL(url);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}};
  function statusOptions(selected){return statuses.map(s=>'<option'+(s===selected?' selected':'')+'>'+s+'</option>').join('')}
  w.renderOpps=function(){
    const holder=d.getElementById('oppTable'); if(!holder)return;
    if(!w.opps.length){holder.innerHTML='<div class="empty">No roles saved yet.</div>';return;}
    holder.innerHTML='<div class="opp-pipeline">'+statuses.map(status=>{
      const list=w.opps.filter(o=>o.status===status);
      const cards=list.length?list.map(o=>{const u=safeUrl(o.url);return '<div class="opp-card '+(status==='No Longer Relevant'?'opp-archived':'')+'"><div class="opp-card-title">'+esc(o.title)+'</div><div class="opp-meta">'+esc(o.company)+(o.note?' · '+esc(o.note):'')+'</div><div class="opportunity-tools"><select onchange="setOppStatus(\''+o.id+'\',this.value)">'+statusOptions(o.status)+'</select>'+(u?'<a class="btn secondary" target="_blank" rel="noopener" href="'+u+'">Open Job</a>':'<span class="small">No link</span>')+'<button class="btn primary" onclick="assessOpp(\''+o.id+'\')">Assess</button><button class="btn danger" onclick="removeOpp(\''+o.id+'\')">Delete</button></div></div>'}).join(''):'<div class="empty">No roles here.</div>';
      return '<div class="opp-group"><h3>'+status+' <span class="opp-count">('+list.length+')</span></h3>'+cards+'</div>';
    }).join('')+'</div>';
  };
  w.setOppStatus=function(id,status){const o=w.opps.find(x=>x.id===id);if(o){o.status=status;w.saveAll();w.render();}};
  w.render();
});
</script></body></html>
